name: Release

on:
  release:
    types: [published]

permissions:
  contents: write       # upload assets + commit back release.json
  pull-requests: write  # open PR to update release.json on main

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set version vars
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          echo "TAG=$TAG"         >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "→ Building release $TAG (version $VERSION)"

      - name: Validate release contract
        run: python3 scripts/release_contract.py validate

      - name: Validate skills index
        run: |
          # A tag can point at a commit that never went through PR checks —
          # never package an index that fails validation.
          python3 scripts/validate-skills-index.py

      - name: Stage package contents
        run: |
          mkdir -p staging
          cp registry.json staging/
          # `miniapp-templates` is NOT a manifest domain and must never be
          # registered in registry.json — its covers file is schemaVersion 2 with
          # a `templates` array and no `domain` field, so the IDE's
          # assertDomainEnvelope() rejects it, and a registry entry would make
          # cacheIntegrity() demand a file that predates this release, forcing a
          # tarball re-download on every startup. It ships here because the IDE
          # reads it by manifest-relative path through the ordinary loader.
          # `peripheral-templates` is deliberately absent: the IDE serves that
          # catalogue from its own bundled media/ copy.
          for dir in boards-and-chips demos platforms skills miniapp-templates; do
            [ -d "$dir" ] && cp -r "$dir" staging/ && echo "  + $dir/"
          done
          FILE_COUNT="$(find staging -type f | wc -l)"
          echo "→ Staged $FILE_COUNT files"

      - name: Create tarball
        run: |
          tar -czf manifests.tar.gz -C staging .
          SHA256="$(sha256sum manifests.tar.gz | awk '{print $1}')"
          SIZE="$(wc -c < manifests.tar.gz | tr -d ' ')"
          echo "SHA256=$SHA256" >> "$GITHUB_ENV"
          echo "SIZE=$SIZE"     >> "$GITHUB_ENV"
          echo "→ manifests.tar.gz — ${SIZE} bytes, sha256=${SHA256}"

      - name: Generate release.json
        run: |
          python3 scripts/release_contract.py generate \
            --tag "$TAG" \
            --version "$VERSION" \
            --sha256 "$SHA256" \
            --size "$SIZE" \
            --output release.json

      - name: Upload GitHub Release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "→ Uploading assets to GitHub Release $TAG…"
          gh release upload "$TAG" manifests.tar.gz release.json --clobber
          echo "✓ GitHub Release assets uploaded"

      - name: Commit release.json to main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          cp release.json /tmp/release.json
          git fetch origin main
          git checkout main
          cp /tmp/release.json release.json
          git add release.json
          if git diff --cached --quiet; then
            echo "→ release.json unchanged, skip PR"
          else
            BRANCH="release/update-release-json-$VERSION"
            git checkout -b "$BRANCH"
            git commit -m "chore(release): update release.json to $VERSION [skip ci]"
            git push origin "$BRANCH"
            gh pr create \
              --title "chore(release): update release.json to $VERSION" \
              --body "Automated release.json update triggered by tag $TAG." \
              --base main \
              --head "$BRANCH"
            gh pr merge "$BRANCH" --squash --delete-branch
            echo "✓ PR merged"
            git fetch origin main
          fi
          # Move the tag to the new main HEAD so the tag's release.json is current
          NEW_HEAD=$(git rev-parse origin/main)
          git tag -f "$TAG" "$NEW_HEAD"
          git push origin "refs/tags/$TAG" --force
          echo "✓ tag $TAG moved to main HEAD (release.json now current)"

      - name: Sync versioned Release to Gitee
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: tuya-open/tuyaopen-ide-manifests
          TAG: ${{ env.TAG }}
          GITEE_ASSETS_DIR: ./gitee-assets
          GITEE_TARGET_COMMITISH: main
        run: |
          echo "→ Syncing versioned release ($TAG) to Gitee…"
          mkdir -p gitee-assets
          cp manifests.tar.gz release.json gitee-assets/
          bash scripts/sync-gitee-release.sh

      - name: Sync latest Release to Gitee
        continue-on-error: true
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
          GITEE_REPO: tuya-open/tuyaopen-ide-manifests
          TAG: latest
          GITEE_ASSETS_DIR: ./gitee-latest-assets
          GITEE_TARGET_COMMITISH: main
        run: |
          echo "→ Updating Gitee 'latest' release (discovery entry)…"
          mkdir -p gitee-latest-assets
          cp release.json gitee-latest-assets/
          bash scripts/sync-gitee-release.sh

      - name: Summary
        run: |
          echo "### Release ${{ env.TAG }} published successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Item | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|------|-------|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Version | \`${{ env.VERSION }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Package size | ${{ env.SIZE }} bytes |" >> "$GITHUB_STEP_SUMMARY"
          echo "| SHA-256 | \`${{ env.SHA256 }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| GitHub asset | [manifests.tar.gz](https://github.com/tuya/tuyaopen-ide-manifests/releases/download/${{ env.TAG }}/manifests.tar.gz) |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Gitee discovery | [release.json](https://gitee.com/tuya-open/tuyaopen-ide-manifests/releases/download/latest/release.json) |" >> "$GITHUB_STEP_SUMMARY"
