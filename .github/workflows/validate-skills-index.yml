name: Skills Index Check

on:
  pull_request:
    paths:
      - "skills/**"
      - "scripts/validate-skills-index.py"
      - "scripts/check-skill-version-bumps.py"
      - ".github/workflows/validate-skills-index.yml"
  push:
    branches:
      - main
    paths:
      - "skills/**"
      - "scripts/validate-skills-index.py"
      - "scripts/check-skill-version-bumps.py"
      - ".github/workflows/validate-skills-index.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The bump check below reads the PR base commit and the last release
          # tag; at the default depth of 1 neither is in the clone.
          fetch-depth: 0

      - name: Validate structure and references
        run: python3 scripts/validate-skills-index.py

      # A per-skill 'version' nobody bumps is worse than no version: the IDE
      # would report installed copies as up to date while the payload changed.
      # PR-only — on a push to main the same commits were already checked on
      # their PR, and 'before' is unreliable for force-pushes / new branches.
      - name: Require a version bump for changed skill payloads
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git show "$BASE_SHA:skills/index.json" > base-skills-index.json \
            || : > base-skills-index.json
          # Versions that never shipped may keep absorbing edits under the same
          # number, so the check needs to know what the last release contained.
          # An unreadable tag leaves the file empty, which falls back to the
          # strict "assume everything shipped" behaviour rather than skipping.
          RELEASE_TAG="$(python3 -c 'import json;print(json.load(open("release.json"))["tag"])')"
          git show "$RELEASE_TAG:skills/index.json" > released-skills-index.json \
            || : > released-skills-index.json
          # --no-renames so a payload file moved out of a skill shows up as a
          # change to that skill too, not only to the one it landed in.
          git diff --name-only --no-renames "$BASE_SHA...HEAD" -- skills/ > changed-skills.txt
          python3 scripts/check-skill-version-bumps.py \
            --base-index base-skills-index.json \
            --released-index released-skills-index.json \
            --changed changed-skills.txt
