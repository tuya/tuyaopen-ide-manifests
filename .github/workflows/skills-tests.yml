name: Skills Script Tests

on:
  pull_request:
    paths:
      - "skills/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/skills-tests.yml"
  push:
    branches:
      - main
    paths:
      - "skills/**"
      - "scripts/**"
      - "tests/**"
      - ".github/workflows/skills-tests.yml"

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # tests/skills/test_panel_dev_style_scan.py drives the panel-dev
      # validator, which is an ES module — declare node instead of relying on
      # whatever the runner image happens to preinstall. Without this the test
      # would skip, and a skipped test reports safety it is not providing.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install test deps
        run: python3 -m pip install --quiet pytest

      # tests/skills covers the scripts shipped inside skill payloads;
      # tests/scripts covers this repo's own CI scripts.
      - name: Run skill and repo script tests
        run: python3 -m pytest tests -q
