name: Update Dev Skills

on:
  repository_dispatch:
    types: [dev-skills-released]

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update skills/index.json
        env:
          VERSION:    ${{ github.event.client_payload.version }}
          SHA256:     ${{ github.event.client_payload.sha256 }}
          SIZE:       ${{ github.event.client_payload.size }}
          GITHUB_URL: ${{ github.event.client_payload.github_url }}
          GITEE_URL:  ${{ github.event.client_payload.gitee_url }}
          TUYACN_URL: ${{ github.event.client_payload.tuyacn_url }}
        run: |
          # Fallback for dispatches from older dev-skills releases without tuyacn_url
          if [ -z "$TUYACN_URL" ]; then
            TUYACN_URL="https://images.tuyacn.com/tuyaopen/tuyaopen-ide-assets/TuyaOpen-dev-skills/TuyaOpen-dev-skills-$VERSION.tar.gz"
          fi
          jq --arg version    "$VERSION" \
             --arg github_url "$GITHUB_URL" \
             --arg gitee_url  "$GITEE_URL" \
             --arg tuyacn_url "$TUYACN_URL" \
             --arg sha256     "$SHA256" \
             --argjson size   "$SIZE" \
             '.devSkillsRelease = {version: $version, github: $github_url, gitee: $gitee_url, tuyacn: $tuyacn_url, sha256: $sha256, size: $size}' \
             skills/index.json > /tmp/index.json && mv /tmp/index.json skills/index.json
          echo "→ devSkillsRelease updated to $VERSION"

      - name: Open PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(skills): bump TuyaOpen-dev-skills to v${{ github.event.client_payload.version }} [skip ci]"
          branch: "chore/bump-dev-skills-v${{ github.event.client_payload.version }}"
          delete-branch: true
          title: "chore(skills): bump TuyaOpen-dev-skills to v${{ github.event.client_payload.version }}"
          body: "Automated update of `skills/index.json` triggered by a new TuyaOpen-dev-skills release."
          author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
